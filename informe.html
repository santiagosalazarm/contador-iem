<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informe de horas</title>
  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261110a">
  <script src="config.js?v=20261110a"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    .report { max-width: 1080px; margin: 0 auto; padding: 32px 20px 60px; }
    .report header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .report header img { height: 46px; display: block; margin-bottom: 14px; }
    .report h1 { margin: 4px 0 0; font-size: 28px; letter-spacing: -.02em; }
    .kpis.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .kpi.extra .ic { background: rgba(224,67,74,.1); color: var(--danger); }
    td.fee, th.fee { color: var(--primary); }
    td.extra, th.extra { color: var(--danger); }
    .zero { color: var(--muted); opacity: .55; }
    .src { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    @media (max-width: 860px) { .kpis.k5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media print {
      .report { padding: 0; max-width: none; }
      .kpis.k5 { grid-template-columns: repeat(5, 1fr); gap: 8px; }
      .kpi { padding: 12px; } .kpi .ic { display: none; } .kpi b { font-size: 18px; }
      table { font-size: 11px; } tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
<main class="report">
  <header>
    <div>
      <img src="logo.svg" alt="Ideas en Movimiento">
      <div class="eyebrow">Informe de horas vs. tareas</div>
      <h1 id="title">Cargando…</h1>
    </div>
    <div class="row no-print">
      <button class="secondary" id="btnCsv">Descargar Excel (CSV)</button>
      <button id="btnPdf">Descargar PDF</button>
    </div>
  </header>

  <div id="err" class="alert error hidden">Este enlace no es válido o expiró.</div>

  <div id="summary" class="hidden">
    <div class="kpis k5">
      <div class="card kpi"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg></div><span>Fee mensual</span><b id="kFee"></b></div>
      <div class="card kpi blue"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><span>Horas del fee</span><b id="kPlan"></b></div>
      <div class="card kpi navy"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17l6-6 4 4 8-8"/></svg></div><span>Usadas del fee</span><b id="kFeeUsed"></b></div>
      <div class="card kpi ok"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg></div><span>Disponibles del fee</span><b id="kLeft"></b></div>
      <div class="card kpi extra"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></div><span>Horas extra</span><b id="kExtra"></b></div>
    </div>
    <section class="card">
      <h2>Uso del fee</h2>
      <div class="bar" id="bar"><span></span></div>
      <p class="small muted" id="barText" style="margin-bottom:0"></p>
    </section>
  </div>

  <section id="detail" class="card hidden">
    <h2>Tareas del mes</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fecha</th><th>Tarea y entregable</th><th>Equipo</th><th class="num">Tiempo real</th>
          <th class="num">Facturado</th><th class="num fee">Del fee</th><th class="num extra">Extra</th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot><tr><th colspan="3">Total</th><th class="num" id="totRaw"></th><th class="num" id="totBilled"></th>
          <th class="num fee" id="totFee"></th><th class="num extra" id="totExtra"></th></tr></tfoot>
      </table>
    </div>
    <p class="small muted" id="rule" style="margin-bottom:0"></p>
  </section>

  <section id="extras" class="card hidden">
    <h2>Horas extra aprobadas</h2>
    <div id="extrasList" class="small"></div>
  </section>
</main>
<script>
const cfg = window.CONTADOR_CONFIG;
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtHM = (min) => { const neg = min < 0, m = Math.abs(Math.round(min)); const h = Math.floor(m / 60), r = m % 60;
  return (neg ? '−' : '') + (h ? (r ? `${h} h ${r} min` : `${h} h`) : `${r} min`); };
const fmtDate = (d) => new Date(d + 'T12:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
let R = null;

(async () => {
  const token = new URLSearchParams(location.search).get('t');
  const { data: r, error } = await sb.rpc('report_by_token', { p_token: token });
  if (error || !r) { $('err').classList.remove('hidden'); $('title').textContent = 'Informe no disponible'; return; }
  R = r;
  const month = new Date(r.starts_on + 'T12:00:00').toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
  $('title').textContent = `${r.client} · ${month}`;
  document.title = `Informe de horas ${r.client} ${month}`;
  const money = (n) => `${r.currency} ${Number(n ?? 0).toLocaleString('en-US', { maximumFractionDigits: 2 })}`;

  let raw = 0, billed = 0, fee = 0, extra = 0;
  $('rows').innerHTML = r.rows.map(t => {
    raw += t.raw_seconds ?? 0; billed += t.billed_minutes; fee += t.fee_minutes; extra += t.extra_minutes;
    const sub = t.deliverable ? `<div class="muted">${esc(t.deliverable)}</div>`
      : t.status !== 'finished' ? '<div class="muted">En curso</div>'
      : t.source === 'card' ? '<div class="src">Horas cargadas en la tarjeta de GHL</div>' : '';
    return `<tr><td>${fmtDate(t.date)}</td>
      <td><strong>${esc(t.title)}</strong>${t.category ? ` <span class="pill">${esc(t.category)}</span>` : ''}${sub}</td>
      <td>${esc(t.member)}</td>
      <td class="num">${t.raw_seconds != null ? fmtHM(t.raw_seconds / 60) : '—'}</td>
      <td class="num">${fmtHM(t.billed_minutes)}</td>
      <td class="num fee ${t.fee_minutes ? '' : 'zero'}">${fmtHM(t.fee_minutes)}</td>
      <td class="num extra ${t.extra_minutes ? '' : 'zero'}">${fmtHM(t.extra_minutes)}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="muted">Aún no hay tareas este mes.</td></tr>';
  $('totRaw').textContent = fmtHM(raw / 60); $('totBilled').textContent = fmtHM(billed);
  $('totFee').textContent = fmtHM(fee); $('totExtra').textContent = fmtHM(extra);
  $('rule').textContent = `Cada tarea se factura en bloques de ${r.block_minutes} minutos hacia arriba; las pausas no cuentan. ` +
    `Las tareas usan primero las ${fmtHM(r.plan_minutes)} del fee, en orden de fecha; solo lo que pasa del fee cuenta como hora extra.`;

  $('kFee').textContent = r.monthly_fee != null ? money(r.monthly_fee) : '—';
  $('kPlan').textContent = fmtHM(r.plan_minutes);
  $('kFeeUsed').textContent = fmtHM(fee);
  $('kLeft').textContent = fmtHM(Math.max(0, r.plan_minutes - fee));
  $('kExtra').textContent = fmtHM(extra);
  const pct = r.plan_minutes ? Math.min(100, fee / r.plan_minutes * 100) : 100;
  $('bar').querySelector('span').style.width = pct + '%';
  if (fee >= r.plan_minutes) $('bar').classList.add('danger'); else if (r.plan_minutes - fee <= 120) $('bar').classList.add('warn');
  $('barText').textContent = `${fmtHM(fee)} usadas de ${fmtHM(r.plan_minutes)} del fee (${Math.round(pct)} %)` +
    (extra ? ` · ${fmtHM(extra)} extra` : '');
  $('summary').classList.remove('hidden'); $('detail').classList.remove('hidden');

  if (r.extensions.length) {
    $('extrasList').innerHTML = r.extensions.map(e =>
      `<div class="client">+ ${fmtHM(e.minutes)} extra · ${money(e.amount)} · aprobadas el ${new Date(e.at).toLocaleDateString('es-CO')}</div>`).join('');
    $('extras').classList.remove('hidden');
  }
})();

$('btnPdf').onclick = () => print();
$('btnCsv').onclick = () => {
  if (!R) return;
  const h = (m) => (Math.round(m) / 60).toFixed(2).replace('.', ',');
  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = [['Fecha', 'Tarea', 'Entregable', 'Categoría', 'Equipo', 'Tiempo real (h)', 'Facturado (h)', 'Del fee (h)', 'Extra (h)']
    .map(q).join(';')];
  for (const t of R.rows) lines.push([t.date, t.title, t.deliverable, t.category, t.member,
    t.raw_seconds != null ? h(t.raw_seconds / 60) : '', h(t.billed_minutes), h(t.fee_minutes), h(t.extra_minutes)].map(q).join(';'));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Informe horas ${R.client} ${R.starts_on.slice(0, 7)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
